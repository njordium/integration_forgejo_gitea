name: Lint & Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  js:
    name: JS / Vue lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run stylelint
      - run: npm run build

  php-lint:
    name: PHP syntax
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
      - name: php -l
        run: find lib appinfo tests -name '*.php' -print0 | xargs -0 -n1 php -l

  security-grep:
    # Regression guard for the v1.0.0 A09 finding — Nextcloud's logger
    # serialises the whole exception context (including the Authorization
    # header) when `['exception' => $e]` is passed. Never reintroduce it.
    name: Security grep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbid ['exception' =>$e] in logger calls
        run: |
          if grep -rn --include='*.php' -E "\['exception'\s*=>\s*\\\$e\]" lib/; then
            echo "::error::Found ['exception' => \$e] in a logger call — this leaks the request context (Authorization header, query params) into nextcloud.log. Log a redacted summary via redactSecrets() instead."
            exit 1
          fi

  php-test:
    name: PHPUnit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:v2
      - name: Install composer deps
        run: composer install --prefer-dist --no-progress
      - name: Run PHPUnit
        run: vendor/bin/phpunit --configuration phpunit.xml

  php-stan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - name: Install composer deps
        run: composer install --prefer-dist --no-progress
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --configuration phpstan.neon --no-progress
